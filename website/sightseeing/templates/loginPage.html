{% load static %}
<!DOCTYPE html>
<html style="font-size: 16px;" lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <title>Login - Odyscape</title>
    
    <link rel="stylesheet" href="{% static 'css/nicepageForLoginPage.css' %}" media="screen">
    
    <link href="https://fonts.googleapis.com/css2?display=swap&family=Roboto:wght@300;400;500;700&family=Open+Sans:wght@300;400;600;700&family=Montserrat:wght@400;500;600;700;800" rel="stylesheet">

    <style>
        /* RESET & GLOBAL STYLES */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            /* Dùng Open Sans làm font chính giống trang Signup */
            font-family: 'Open Sans', sans-serif; 
        }

        /* BỐ CỤC CHIA ĐÔI (SPLIT SCREEN) */
        .split-container {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* CỘT TRÁI: HÌNH ẢNH */
        .split-image-side {
            flex: 1.2; 
            /* Ảnh Vịnh Hạ Long */
            background-image: url('{% static "images/sunSet.png" %}');           
            background-size: cover;     
            background-position: center;
            position: relative;
        }
        
        .split-image-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.4));
        }

        /* CỘT PHẢI: FORM ĐĂNG NHẬP */
        .split-form-side {
            flex: 0.8;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            overflow-y: auto;
        }

        .login-wrapper {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        /* LOGO & TEXT - ĐÃ ĐỒNG BỘ FONT VỚI SIGNUP */
        .login-logo {
            width: 120px; /* Chỉnh size bằng trang Signup (120px) */
            height: auto;
            margin-bottom: 15px;
        }

        .login-title {
            /* Font Montserrat, size 2.5rem giống trang Signup */
            font-family: 'Montserrat', sans-serif; 
            font-size: 2.5rem; 
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
            line-height: 1.2;
        }

        .login-subtitle {
            /* Font Roboto, size 1.1rem giống trang Signup */
            font-family: 'Roboto', sans-serif; 
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 30px;
            font-weight: 300;
        }

        /* FORM STYLING */
        .custom-input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .custom-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444; /* Màu xám đậm giống Signup */
            font-family: 'Open Sans', sans-serif;
            font-size: 0.9rem;
        }

        .custom-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.3s;
            font-family: 'Open Sans', sans-serif;
        }

        .custom-input:focus {
            border-color: #e06703;
            outline: none;
        }

        /* BUTTONS & LINKS */
        .forgot-pass-link {
            display: block;
            text-align: right;
            color: #e06703;
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 20px;
            font-family: 'Open Sans', sans-serif;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #e06703;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem; /* Size 1rem giống Signup */
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            background-color: #c95a00;
        }

        .signup-text {
            margin-top: 20px;
            font-size: 0.95rem;
            font-family: 'Open Sans', sans-serif;
        }
        .signup-text a {
            color: #e06703;
            text-decoration: none;
            font-weight: 700;
        }

        /* MESSAGE ALERT */
        .alert-box {
            padding: 10px; 
            margin-bottom: 15px; 
            border-radius: 5px; 
            font-size: 0.9rem;
            font-family: 'Open Sans', sans-serif;
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .split-container {
                flex-direction: column;
            }
            .split-image-side {
                flex: none;
                height: 200px;
            }
            .split-form-side {
                flex: 1;
                padding: 20px;
                padding-top: 40px;
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>

    <section class="split-container">
        <div class="split-image-side">
            <div class="split-image-overlay"></div>
        </div>

        <div class="split-form-side">
            <div class="login-wrapper">
                <a href="{% url 'home' %}">
                    <img src="{% static 'images/Odyscape.png' %}" alt="Odyscape" class="login-logo">
                </a>

                <h1 class="login-title">Welcome Back</h1>
                <p class="login-subtitle">Login to your Odyscape account</p>

                {% if messages %}
                    {% for message in messages %}
                    <div class="alert-box" style="background: {% if 'error' in message.tags %}#ffebee{% else %}#e8f5e9{% endif %}; color: {% if 'error' in message.tags %}#c62828{% else %}#2e7d32{% endif %};">
                        {{ message }}
                    </div>
                    {% endfor %}
                {% endif %}

                <form action="{% url 'login_page' %}" method="POST">
                    {% csrf_token %}
                    
                    <div class="custom-input-group">
                        <label for="username" class="custom-label">Username or Email</label>
                        <input type="text" id="username" name="username" class="custom-input" placeholder="Enter your username or email" required>
                    </div>

                    <div class="custom-input-group">
                        <label for="password" class="custom-label">Password</label>
                        <input type="password" id="password" name="password" class="custom-input" placeholder="Enter your password" required>
                    </div>

                    <a href="{% url 'password_reset' %}" class="forgot-pass-link">Forgot password?</a>

                    <button type="submit" class="submit-btn">SUBMIT</button>
                </form>

                <p class="signup-text">
                    Don't have an account? <a href="{% url 'signup_page' %}">Sign up</a>
                </p>
            </div>
        </div>
    </section>

</body>
</html>
