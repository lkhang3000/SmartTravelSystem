{% load static %}
{% load i18n %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% trans "Sign up" %}</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="page">
  <main class="card">
    <h1 class="brand">{% trans "Sign up" %}</h1>

    {% if messages %}
      {% for message in messages %}
        <div class="error">{{ message }}</div>
      {% endfor %}
    {% endif %}    <form id="signupForm" method="post" action="{% url 'signup_page' %}" novalidate>
      {% csrf_token %}

      <label class="field">
        <span class="label">{% trans "Username" %}</span>
        <input type="text" name="username" value="{{ form.username.value|default:'' }}" required />
        {% if form.username.errors %}<div class="field-error">{{ form.username.errors.0 }}</div>{% endif %}
      </label>

      <label class="field">
        <span class="label">{% trans "Email" %}</span>
        <input type="email" name="email" value="{{ form.email.value|default:'' }}" required />
        {% if form.email.errors %}<div class="field-error">{{ form.email.errors.0 }}</div>{% endif %}
      </label>

      <label class="field">
        <span class="label">{% trans "Phone" %}</span>
        <input type="tel" name="phone" value="{{ form.phone.value|default:'' }}" />
        {% if form.phone.errors %}<div class="field-error">{{ form.phone.errors.0 }}</div>{% endif %}
      </label>

      <label class="field">
        <span class="label">{% trans "New password" %}</span>
        <input type="password" name="password1" required />
        {% if form.password1.errors %}<div class="field-error">{{ form.password1.errors.0 }}</div>{% endif %}
      </label>

      <label class="field">
        <span class="label">{% trans "Confirm new password" %}</span>
        <input type="password" name="password2" required />
        {% if form.password2.errors %}<div class="field-error">{{ form.password2.errors.0 }}</div>{% endif %}
      </label>

      <div class="row-between">
        <a class="link" href="{% url 'login_page' %}">{% trans "Log in" %}</a>
        <button type="submit" class="btn primary">{% trans "Sign up" %}</button>
      </div>
    </form>
  </main>

</body>
</html>
