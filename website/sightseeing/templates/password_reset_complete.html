{% load static %}
<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset Password</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="resetpage">
  <div class="split-container">
    
    <div class="image-column">
      <img src="{% static 'images/image.png' %}" alt="Reset Password Illustration" />
    </div>

    <main class="card">
  <a href="{% url 'home' %}" class="logo-link">
  <img class="logo-top-right" src="{% static 'images/Odyscape.png' %}" alt="Logo" style="width: 120px;" />
  </a>
  
     <div class="success-icon">✓</div>
    <h1 class="brand">Password Reset Successful!</h1>
    
    <p class="muted">Your password has been reset successfully.</p>
    <p class="muted">You can now log in with your new password.</p>

    <div class = "btn-row" style="margin-top: 30px;">
      <a class="smart-btn" href="{% url 'login_page' %}">Back to Login</a>
    </div>
</main>

  </div>
  <style>
    .btn-row {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    gap: 20px;
}


.resetpage {
  background: #ffebd4ff;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px;
}

/* Container cho layout 2 cột */
.split-container {
  display: flex;
  max-width: 1200px;
  width: 100%;
  min-height: 800px; /* Đảm bảo chiều cao tối thiểu cho container cha */
  background-color: #fff;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
  overflow: hidden;
  align-items: stretch; /* Đảm bảo các cột con kéo dài hết chiều cao */
}

/* Cột Hình ảnh (Bên trái) */
.image-column {
  flex: 1; /* Hai cột bằng nhau */
  background-color: #f7f7f7;
  padding: 0; /* Loại bỏ padding để ảnh lấp đầy hoàn toàn */
  height: 700px; 
  display: flex; 
  align-items: center; 
  justify-content: center;
}

.image-column img {
  width: 600px; 
  height: 900px; 
  display: block;
  
  /* Giữ tỷ lệ và lấp đầy, cắt bỏ các cạnh nếu cần */
  object-fit: cover; 
}

/* Cột Form (Bên phải - .card) */
.card {
  text-align: center;
  flex: 1;
  padding: 60px; /* Padding cao hơn để tạo chiều cao form */
  background-color: #fff;
  box-shadow: none; 
  border-radius: 0;
  /* Quan trọng 1: Đặt cha là relative để con (logo) định vị tuyệt đối theo nó */
  position: relative; 
  
  /* Giữ các thuộc tính cũ để căn giữa form */
  display: flex;
  flex-direction: column;
  justify-content: center;
}

/* Định vị Logo tuyệt đối */
.logo-top-right {
  /* Quan trọng 2: Thiết lập vị trí tuyệt đối */
  position: absolute;
  top: 20px; /* Cách lề trên 20px */
  right: 20px; /* Cách lề phải 20px */
  width: 120px; /* Giữ nguyên kích thước đã đặt */
  height: auto;
  /* Đặt z-index cao hơn nếu bạn lo logo bị nội dung khác che khuất */
  z-index: 10; 
}

  /* Các style chung cho form và typography */
  .brand {
    text-align: center;
      font-size: 2em;
      color: #333;
      margin-bottom: 0.5em;
    }
    .muted {
      text-align: center;
      color: #777;
      margin-bottom: 1.5em;
    }
  .error {
    color: #d9534f;
    background-color: #fdd;
    border: 1px solid #d9534f;
    padding: 10px;
    border-radius: 4px;
    margin-bottom: 15px;
  }
  .field {
    display: block;
    margin-bottom: 15px;
  }
  .label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
    color: #555;
  }
  input[type="email"] {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box; /* Quan trọng */
  }
  .field-error {
    color: #d9534f;
    font-size: 0.9em;
    margin-top: 5px;
  }
  .row-between {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
  }
  .link {
    font-weight: bold;
    color: #ff9e30ff;
    text-decoration: none;
  }
  .link:hover {
    text-decoration: underline;
  }
  .smart-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;

    background: #F7931E;
    color: #fff !important;

    padding: 14px 28px;
    border: none;
    border-radius: 50px;

    font-size: 16px;
    font-weight: 600;
    cursor: pointer;

    text-decoration: none;
    transition: all 0.25s ease;

    box-shadow: 0 4px 12px rgba(247, 147, 30, 0.35);
}

.smart-btn:hover {
    background: #FFA93D;
    transform: translateY(-3px);
    box-shadow: 0 6px 16px rgba(247, 147, 30, 0.45);
}

.smart-btn:active {
    transform: translateY(-1px) scale(0.97);
}
  .success-icon {
      font-size: 64px;
      color: #4CAF50;
      margin-bottom: 20px;
    }
</style>
</body>
</html>
