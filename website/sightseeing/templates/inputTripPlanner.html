{% load static %}
{% load i18n %}{% get_current_language as LANGUAGE_CODE %}<!DOCTYPE html>
<html style="font-size: 16px;" lang="{{ LANGUAGE_CODE|default:'en' }}">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <title>DEBUG TEST TITLE - Odyscape</title><!-- DEBUG -->
    
    <link rel="stylesheet" href="{% static 'css/nicepageForInputTripPlanner.css' %}" media="screen">
    <link rel="stylesheet" href="{% static 'css/indexForInputTripPlanner.css' %}" media="screen">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- 1. GLOBAL STYLES --- */
        .u-section-1 {
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?q=80&w=2070&auto=format&fit=crop') !important;
            background-size: cover !important;
            background-position: center !important;
            font-family: 'Montserrat', sans-serif !important;
        }

        .u-section-1 .u-list-item-1 {
            background: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(10px);
            border-radius: 20px !important;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2) !important;
            border: none !important;
            padding: 25px 30px !important;
            max-width: 550px;
            margin: 0 auto !important;
        }

        .side-image { display: none !important; }

        .u-section-1 .u-image-1 {
            width: 100px !important;
            height: auto !important;
            margin-bottom: 5px !important;
        }

        /* --- 2. INPUT FIELDS --- */
        .u-input-rectangle {
            border: 1px solid #e0e0e0 !important;
            border-radius: 8px !important;
            padding: 10px 12px !important;
            background-color: #f9f9f9 !important;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .u-input-rectangle:focus {
            background-color: #fff !important;
            border-color: #FB8700 !important;
            box-shadow: 0 0 0 3px rgba(251, 135, 0, 0.1) !important;
            outline: none;
        }
        .u-label {
            font-weight: 600 !important;
            font-size: 0.9rem !important;
            color: #444 !important;
            margin-bottom: 6px !important;
            display: block;
        }

        /* --- 3. LINK "WRITE A NEW GUIDE" --- */
        .link-new-guide {
            color: #FB8700 !important;
            text-decoration: underline !important;
            font-weight: 600 !important;
            font-size: 0.95rem !important;
            margin-bottom: 20px;
            display: inline-block;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .link-new-guide:hover {
            color: #d84315 !important;
            transform: translateY(-1px);
        }

        /* --- 6. BUTTON --- */
        button[type="submit"] {
            background: #FB8700 !important;
            color: white !important;
            font-weight: 600 !important;
            border-radius: 50px !important;
            padding: 12px 30px !important;
            box-shadow: 0 4px 15px rgba(251, 135, 0, 0.25) !important;
            transition: all 0.2s;
            width: 100%;
            margin-top: 20px;
            border: none;
            cursor: pointer;
        }
        button[type="submit"]:hover {
            background: #f57c00 !important;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(251, 135, 0, 0.35) !important;
        }

        .u-repeater-1 { grid-template-columns: 1fr !important; }

        /* Flatpickr dropdown fixes */
        .flatpickr-monthDropdown-months { pointer-events: auto; }
        .flatpickr-current-month span { pointer-events: auto; }
        .flatpickr-calendar { z-index: 9999; }

        /* Flatpickr custom colors */
        .flatpickr-day.selected {
            background-color: #FB8700 !important;
            border-color: #FB8700 !important;
        }
        .flatpickr-day.selected:hover {
            background-color: #d84315 !important;
        }
        .flatpickr-day.startRange, .flatpickr-day.endRange {
            background-color: #FB8700 !important;
            border-color: #FB8700 !important;
        }
        .flatpickr-day.inRange {
            background-color: rgba(251, 135, 0, 0.1) !important;
        }
    </style>
</head>

<body class="u-body u-xl-mode">
    <section class="u-clearfix u-section-1">
        <div class="u-clearfix u-sheet u-sheet-1" style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
            
            <div class="u-list-item-1">
                <div class="u-container-layout-1" style="text-align: center;">
                    <img class="u-image u-image-1" src="{% static 'images/Odyscape.png' %}" alt="{{ odyscape_logo }}">
                    
                    <h1 class="u-text-1" style="font-size: 1.8rem; margin: 5px 0 10px;">{{ plan_new_trip }}</h1>
                    
                    <a href="#" class="link-new-guide">{{ or_write_guide }}</a>

                    <form action="{% url 'trip_form' %}" method="POST" class="u-form-vertical" style="margin-top: 15px; text-align: left;" onsubmit="return validateDates()">
                        {% csrf_token %}
                        
                        <div class="u-form-group">
                            <label for="destination" class="u-label">{% trans "Destination" %}</label>
                            <select id="destination" name="destination" class="u-input-rectangle" style="width: 100%;" required>
                                <option value="">{% trans "Where do you want to go?" %}</option>
                                {% for loc in all_locations %}
                                <option value="{{ loc.locationName }}">{{ loc.locationName }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div style="display: flex; gap: 15px; margin-top: 15px;">
                            <div class="u-form-group" style="flex: 1;">
                                <label class="u-label">{% trans "Start Date" %}</label>
                                <input type="text" id="start-date" name="departure" class="u-input-rectangle datepicker" placeholder="{% trans 'dd/mm/yyyy' %}" required>
                            </div>
                            <div class="u-form-group" style="flex: 1;">
                                <label class="u-label">{% trans "End Date" %}</label>
                                <input type="text" id="end-date" name="arrival" class="u-input-rectangle datepicker" placeholder="{% trans 'dd/mm/yyyy' %}" required>
                            </div>
                        </div>
                        <div id="dateError" style="color: red; font-size: 0.9rem; margin-top: 5px; display: none;">{% trans "Trip duration cannot exceed 1 year." %}</div>

                        <div class="u-form-group" style="margin-top: 15px;">
                            <label for="travelers" class="u-label">{% trans "Travelers" %}</label>
                            <input type="number" id="travelers" name="travelers" 
                                   class="u-input-rectangle" style="width: 100%;" 
                                   min="1" step="1" value="{{ travelers }}" placeholder="{% trans 'Enter number of people' %}" required>
                        </div>

                        <button type="submit">{% trans "START PLANNING" %}</button>
                    </form>
                </div>
            </div>

        </div>
    </section>

    <script>
        function validateDates() {
            let start = document.getElementById("start-date").value;
            let end = document.getElementById("end-date").value;

            if (!start || !end) return true;

            let startParts = start.split('/');
            let endParts = end.split('/');

            if (startParts.length !== 3 || endParts.length !== 3) return true;

            let startDate = new Date(startParts[2], startParts[1] - 1, startParts[0]);
            let endDate = new Date(endParts[2], endParts[1] - 1, endParts[0]);

            let diffDays = Math.floor((endDate - startDate) / (1000 * 60 * 60 * 24));

            let year = startDate.getFullYear();
            let isLeap = (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
            let maxDays = isLeap ? 366 : 365;

            if (diffDays > maxDays) {
                document.getElementById("dateError").style.display = "block";
                return false;
            }

            document.getElementById("dateError").style.display = "none";
            return true;
        }

        document.addEventListener("DOMContentLoaded", function () {
            const millionVNDText = "{% trans 'million VND' %}";

            const startPicker = flatpickr("#start-date", {
                dateFormat: "d/m/Y",
                minDate: "today",
                allowInput: false,
                monthSelectorType: "static",
                yearSelectorType: "static",
                closeOnSelect: false,
                disableMobile: true,
                onChange: function (selectedDates) {
                    if (selectedDates.length) {
                        endPicker.set("minDate", selectedDates[0]);
                    }
                }
            });

            const endPicker = flatpickr("#end-date", {
                dateFormat: "d/m/Y",
                minDate: "today",
                allowInput: false,
                monthSelectorType: "static",
                yearSelectorType: "static",
                closeOnSelect: false,
                disableMobile: true
            });

            // No price calculation needed

            document.getElementById("start-date").addEventListener("input", () =>
                document.getElementById("dateError").style.display = "none"
            );
            document.getElementById("end-date").addEventListener("input", () =>
                document.getElementById("dateError").style.display = "none"
            );
        });
    </script>


</body>
</html>
