{% load static %}
<!DOCTYPE html>
<html style="font-size: 16px;" lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <title>Plan Your Trip - Odyscape</title>
    
    <link rel="stylesheet" href="{% static 'css/nicepageForInputTripPlanner.css' %}" media="screen">
    <link rel="stylesheet" href="{% static 'css/indexForInputTripPlanner.css' %}" media="screen">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- 1. GLOBAL STYLES --- */
        .u-section-1 {
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?q=80&w=2070&auto=format&fit=crop') !important;
            background-size: cover !important;
            background-position: center !important;
            font-family: 'Montserrat', sans-serif !important;
        }

        .u-section-1 .u-list-item-1 {
            background: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(10px);
            border-radius: 20px !important;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2) !important;
            border: none !important;
            padding: 25px 30px !important;
            max-width: 550px;
            margin: 0 auto !important;
        }

        .side-image { display: none !important; }

        .u-section-1 .u-image-1 {
            width: 100px !important;
            height: auto !important;
            margin-bottom: 5px !important;
        }

        /* --- 2. INPUT FIELDS --- */
        .u-input-rectangle {
            border: 1px solid #e0e0e0 !important;
            border-radius: 8px !important;
            padding: 10px 12px !important;
            background-color: #f9f9f9 !important;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .u-input-rectangle:focus {
            background-color: #fff !important;
            border-color: #FB8700 !important;
            box-shadow: 0 0 0 3px rgba(251, 135, 0, 0.1) !important;
            outline: none;
        }
        .u-label {
            font-weight: 600 !important;
            font-size: 0.9rem !important;
            color: #444 !important;
            margin-bottom: 6px !important;
            display: block;
        }

        /* --- 3. LINK "WRITE A NEW GUIDE" --- */
        .link-new-guide {
            color: #FB8700 !important;
            text-decoration: underline !important;
            font-weight: 600 !important;
            font-size: 0.95rem !important;
            margin-bottom: 20px;
            display: inline-block;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .link-new-guide:hover {
            color: #d84315 !important;
            transform: translateY(-1px);
        }

        /* --- 4. BUDGET SLIDER --- */
        .range-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        input[type=range] {
            flex-grow: 1;
            accent-color: #FB8700;
            height: 4px;
            cursor: pointer;
        }
        .budget-display {
            font-weight: 700;
            color: #FB8700;
            width: 60px;
            text-align: center;
            padding: 5px !important;
        }

        /* --- 5. PRICE BOX (Đã chỉnh sửa khoảng cách) --- */
        .price-result-box {
            display: flex;
            justify-content: center; /* Canh giữa nội dung */
            align-items: center;
            gap: 10px; /* TẠO KHOẢNG CÁCH GIỮA CHỮ VÀ SỐ Ở ĐÂY */
            
            background: rgba(251, 135, 0, 0.06);
            border: 1px dashed #FB8700;
            border-radius: 10px;
            padding: 12px 20px;
            margin-top: 15px;
        }
        
        .price-label {
            font-size: 0.85rem;
            color: #666;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 0;
        }
        
        .price-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: #E65100;
            margin: 0;
        }

        /* --- 6. BUTTON --- */
        button[type="submit"] {
            background: #FB8700 !important;
            color: white !important;
            font-weight: 600 !important;
            border-radius: 50px !important;
            padding: 12px 30px !important;
            box-shadow: 0 4px 15px rgba(251, 135, 0, 0.25) !important;
            transition: all 0.2s;
            width: 100%;
            margin-top: 20px;
            border: none;
            cursor: pointer;
        }
        button[type="submit"]:hover {
            background: #f57c00 !important;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(251, 135, 0, 0.35) !important;
        }

        .u-repeater-1 { grid-template-columns: 1fr !important; }
    </style>
</head>

<body class="u-body u-xl-mode">
    <section class="u-clearfix u-section-1">
        <div class="u-clearfix u-sheet u-sheet-1" style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
            
            <div class="u-list-item-1">
                <div class="u-container-layout-1" style="text-align: center;">
                    <img class="u-image u-image-1" src="{% static 'images/Odyscape.png' %}" alt="Odyscape Logo">
                    
                    <h1 class="u-text-1" style="font-size: 1.8rem; margin: 5px 0 10px;">Plan a new trip</h1>
                    
                    <a href="#" class="link-new-guide">Or write a new guide</a>

                    <form action="{% url 'trip_form' %}" method="POST" class="u-form-vertical" style="margin-top: 15px; text-align: left;">
                        {% csrf_token %}
                        
                        <div class="u-form-group">
                            <label for="destination" class="u-label">Destination</label>
                            <select id="destination" name="destination" class="u-input-rectangle" style="width: 100%;" required>
                                <option value="">Where do you want to go?</option>
                                {% for loc in all_locations %}
                                <option value="{{ loc.locationName }}">{{ loc.locationName }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div style="display: flex; gap: 15px; margin-top: 15px;">
                            <div class="u-form-group" style="flex: 1;">
                                <label class="u-label">Start Date</label>
                                <input type="text" name="departure" class="u-input-rectangle datepicker" placeholder="dd/mm/yyyy">
                            </div>
                            <div class="u-form-group" style="flex: 1;">
                                <label class="u-label">End Date</label>
                                <input type="text" name="arrival" class="u-input-rectangle datepicker" placeholder="dd/mm/yyyy">
                            </div>
                        </div>

                        <div class="u-form-group" style="margin-top: 15px;">
                            <label for="travelers" class="u-label">Travelers</label>
                            <input type="number" id="travelers" name="travelers" 
                                   class="u-input-rectangle" style="width: 100%;" 
                                   min="1" step="1" value="1" placeholder="Enter number of people" required>
                        </div>

                        <div class="u-form-group" style="margin-top: 15px;">
                            <label class="u-label">Total Budget (Million VND)</label>
                            <div class="range-container">
                                <span style="font-size: 0.8rem; color: #777;">0</span>
                                <input type="range" id="budgetRange" name="budget" min="0" max="100" value="0" step="1">
                                <span style="font-size: 0.8rem; color: #777;">100</span>
                                <input type="number" id="budgetInput" class="u-input-rectangle budget-display" value="0" min="0" max="100">
                            </div>
                        </div>

                        <div class="price-result-box">
                            <span class="price-label">Price / Person:</span>
                            <span class="price-value" id="priceDisplay">0 ₫</span>
                            <input type="hidden" name="price_per_person" id="hiddenPricePerPerson">
                        </div>

                        <button type="submit">START PLANNING</button>
                    </form>
                </div>
            </div>

        </div>
    </section>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            // === DATE PICKER START / END ===
            const startInput = document.querySelector('input[name="departure"]');
            const endInput   = document.querySelector('input[name="arrival"]');

            const startPicker = flatpickr(startInput, {
                dateFormat: "d/m/Y",
                minDate: "today",
                disableMobile: true,
                onChange: function (selectedDates) {
                    if (selectedDates.length > 0) {
                        endPicker.set("minDate", selectedDates[0]);

                        // Nếu end date < start date thì clear
                        if (endPicker.selectedDates.length > 0 &&
                            endPicker.selectedDates[0] < selectedDates[0]) {
                            endPicker.clear();
                        }
                    }
                }
            });

            const endPicker = flatpickr(endInput, {
                dateFormat: "d/m/Y",
                minDate: "today",
                disableMobile: true
            });


            // === BUDGET CALCULATION (GIỮ NGUYÊN) ===
            const budgetRange = document.getElementById("budgetRange");
            const budgetInput = document.getElementById("budgetInput");
            const travelersInput = document.getElementById("travelers");
            const priceDisplay = document.getElementById("priceDisplay");
            const hiddenInput = document.getElementById("hiddenPricePerPerson");

            const formatCurrency = (amount) => {
                return new Intl.NumberFormat('vi-VN', {
                    style: 'currency',
                    currency: 'VND'
                }).format(amount);
            };

            function updateCalculation() {
                let budgetMillion = parseFloat(budgetRange.value) || 0;
                let totalBudgetVND = budgetMillion * 1000000;
                let people = parseInt(travelersInput.value) || 1;
                if (people < 1) people = 1;

                let perPerson = totalBudgetVND / people;

                priceDisplay.textContent = formatCurrency(perPerson);
                hiddenInput.value = perPerson;
            }

            budgetRange.addEventListener("input", () => {
                budgetInput.value = budgetRange.value;
                updateCalculation();
            });

            budgetInput.addEventListener("input", () => {
                if (parseInt(budgetInput.value) > 100) budgetInput.value = 100;
                budgetRange.value = budgetInput.value;
                updateCalculation();
            });

            travelersInput.addEventListener("input", updateCalculation);

            updateCalculation();
        });
    </script>

</body>
</html>
