  <script>
    // Sync budget slider and number input
    const budgetSlider = document.getElementById('number-8726');
    const budgetNumber = document.getElementById('number-number-8726');
    const travelersSelect = document.getElementById('select-f433');
    const priceInput = document.getElementById('price_per_person');
    const budgetText = document.getElementById('budget-text');
    const priceText = document.getElementById('price-text');
    
    // Format number to currency text
    function formatCurrencyText(amount) {
      if (amount === 0) return '0 VND';
      
      if (amount >= 1000000) {
        const millions = amount / 1000000;
        return millions % 1 === 0 
          ? `${millions.toLocaleString('en-US')} million VND`
          : `${millions.toLocaleString('en-US', {maximumFractionDigits: 2})} million VND`;
      } else if (amount >= 1000) {
        const thousands = amount / 1000;
        return thousands % 1 === 0
          ? `${thousands.toLocaleString('en-US')} thousand VND`
          : `${thousands.toLocaleString('en-US', {maximumFractionDigits: 2})} thousand VND`;
      } else {
        return `${amount.toLocaleString('en-US')} VND`;
      }
    }
    
    // Sync slider to number input
    budgetSlider.addEventListener('input', function() {
      budgetNumber.value = this.value;
      updateBudgetText();
      updatePricePerPerson();
    });
    
    // Sync number input to slider
    budgetNumber.addEventListener('input', function() {
      budgetSlider.value = this.value;
      updateBudgetText();
      updatePricePerPerson();
    });
    
    // Listen for travelers change
    travelersSelect.addEventListener('change', updatePricePerPerson);
    
    // Update budget text display
    function updateBudgetText() {
      const budget = parseFloat(budgetNumber.value) || 0;
      budgetText.textContent = formatCurrencyText(budget);
    }
    
    // Auto-calculate price per person
    function updatePricePerPerson() {
      const budget = parseFloat(budgetNumber.value) || 0;
      const travelers = parseInt(travelersSelect.value) || 1;
      
      // Budget is now in VND, divide by travelers
      const pricePerPerson = budget / travelers;
      
      // Update price_per_person input with formatted number
      priceInput.value = Math.round(pricePerPerson).toLocaleString('en-US');
      
      // Update price text display
      priceText.textContent = formatCurrencyText(Math.round(pricePerPerson));
    }
    
    // Initial calculation
    updateBudgetText();
    updatePricePerPerson();
  </script>
