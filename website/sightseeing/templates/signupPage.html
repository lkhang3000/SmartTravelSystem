{% load static %}
<!DOCTYPE html>
<html style="font-size: 16px;" lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <title>Create Account - Odyscape</title>
    
    <link rel="stylesheet" href="{% static 'css/nicepageForSignupPage.css' %}" media="screen">
    
    <link href="https://fonts.googleapis.com/css2?display=swap&family=Roboto:wght@300;400;500;700&family=Open+Sans:wght@300;400;600;700&family=Montserrat:wght@400;500;600;700;800" rel="stylesheet">

    <style>
        /* RESET & GLOBAL STYLES */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Open Sans', sans-serif;
            background-color: #fff; 
        }

        /* BỐ CỤC CHIA ĐÔI */
        .split-container {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* CỘT TRÁI: ẢNH HỘI AN */
        .split-image-side {
            flex: 1.2; 
            /* Ảnh Phố cổ Hội An (Unsplash) */
            background-image: url('{% static "images/HoiAnLatterns.jpg" %}');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        
        .split-image-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            /* Lớp phủ tối nhẹ để làm dịu ảnh */
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.3));
        }

        /* CỘT PHẢI: FORM ĐĂNG KÝ */
        .split-form-side {
            flex: 0.8;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Dùng padding top/bottom lớn hơn vì form dài */
            padding: 40px 40px; 
            overflow-y: auto; /* Cho phép cuộn */
        }

        .signup-wrapper {
            width: 100%;
            max-width: 500px; /* Rộng hơn trang login xíu để chứa 2 cột tên */
            text-align: center;
            margin: auto 0; /* Căn giữa theo chiều dọc nếu form ngắn, cuộn nếu dài */
        }

        /* LOGO & TITLE */
        .login-logo {
            width: 120px; /* Nhỏ hơn trang login xíu để tiết kiệm diện tích */
            height: auto;
            margin-bottom: 15px;
        }

        .login-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.5rem; /* Cỡ chữ lớn, đậm */
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
            line-height: 1.2;
        }

        .login-subtitle {
            font-family: 'Roboto', sans-serif;
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 25px;
            font-weight: 300;
        }

        /* FORM ELEMENTS */
        .custom-input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        /* Hàng ngang chứa First Name & Last Name */
        .form-row {
            display: flex;
            gap: 15px; /* Khoảng cách giữa 2 ô */
        }
        
        .form-row .custom-input-group {
            flex: 1; /* Chia đều không gian */
        }

        .custom-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444;
            font-size: 0.9rem;
        }

        .custom-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.3s;
            font-family: 'Open Sans', sans-serif;
        }

        .custom-input:focus {
            border-color: #e06703;
            outline: none;
        }

        /* CHECKBOX STYLE */
        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #555;
            text-align: left;
        }
        .checkbox-group input {
            margin-right: 10px;
            width: 16px;
            height: 16px;
            accent-color: #e06703;
            cursor: pointer;
        }
        .checkbox-group a {
            color: #e06703;
            text-decoration: none;
            font-weight: 600;
        }

        /* BUTTON */
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #e06703;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .submit-btn:hover {
            background-color: #c95a00;
        }

        .login-redirect-text {
            margin-top: 20px;
            font-size: 0.95rem;
        }
        .login-redirect-text a {
            color: #e06703;
            text-decoration: none;
            font-weight: 700;
        }

        /* MESSAGE ALERT */
        .alert-box {
            padding: 10px; 
            margin-bottom: 15px; 
            border-radius: 5px; 
            font-size: 0.9rem;
            text-align: left;
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .split-container {
                flex-direction: column;
            }
            .split-image-side {
                flex: none;
                height: 180px; /* Banner ảnh nhỏ phía trên */
            }
            .split-form-side {
                flex: 1;
                padding: 30px 20px;
                justify-content: flex-start;
            }
            /* Trên mobile, có thể để tên thành 2 dòng cho dễ nhập nếu màn hình quá bé */
            @media (max-width: 400px) {
                .form-row {
                    flex-direction: column;
                    gap: 0;
                }
            }
        }
    </style>
</head>
<body>

    <section class="split-container">
        <div class="split-image-side">
            <div class="split-image-overlay"></div>
            </div>

        <div class="split-form-side">
            <div class="signup-wrapper">
                <a href="{% url 'home' %}">
                    <img src="{% static 'images/Odyscape.png' %}" alt="Odyscape" class="login-logo">
                </a>

                <h1 class="login-title">Create Account</h1>
                <p class="login-subtitle">Join Odyscape today</p>

                {% if messages %}
                    {% for message in messages %}
                    <div class="alert-box" style="background: {% if 'error' in message.tags %}#ffebee{% else %}#e8f5e9{% endif %}; color: {% if 'error' in message.tags %}#c62828{% else %}#2e7d32{% endif %};">
                        {{ message }}
                    </div>
                    {% endfor %}
                {% endif %}

                <form action="{% url 'signup_page' %}" method="POST">
                    {% csrf_token %}
                    
                    <div class="custom-input-group">
                        <label for="username" class="custom-label">Username</label>
                        <input type="text" id="username" name="username" class="custom-input" placeholder="Enter your username" required>
                    </div>

                    <div class="custom-input-group">
                        <label for="email" class="custom-label">Email</label>
                        <input type="email" id="email" name="email" class="custom-input" placeholder="Enter your email" required>
                    </div>

                    <div class="form-row">
                        <div class="custom-input-group">
                            <label for="first_name" class="custom-label">First Name</label>
                            <input type="text" id="first_name" name="first_name" class="custom-input" placeholder="First name">
                        </div>
                        <div class="custom-input-group">
                            <label for="last_name" class="custom-label">Last Name</label>
                            <input type="text" id="last_name" name="last_name" class="custom-input" placeholder="Last name">
                        </div>
                    </div>

                    <div class="custom-input-group">
                        <label for="password1" class="custom-label">Password</label>
                        <input type="password" id="password1" name="password1" class="custom-input" placeholder="Create a password (8+ chars)" required minlength="8">
                    </div>

                    <div class="custom-input-group">
                        <label for="password2" class="custom-label">Confirm password</label>
                        <input type="password" id="password2" name="password2" class="custom-input" placeholder="Confirm your password" required minlength="8">
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="agree" name="agree" required>
                        <label for="agree">I accept the <a href="#">Terms of Service</a></label>
                    </div>

                    <button type="submit" class="submit-btn">CREATE ACCOUNT</button>
                </form>

                <p class="login-redirect-text">
                    Already have an account? <a href="{% url 'login_page' %}">Login</a>
                </p>
            </div>
        </div>
    </section>

</body>
</html>
