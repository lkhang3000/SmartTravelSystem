<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi Mật Khẩu Thành Công</title>
    <style>
        body { font-family: 'Inter', Arial, sans-serif; background-color: #f6f9ff; margin: 0; padding: 40px; }
        .container { 
            width: 400px; margin: 40px auto; padding: 30px; 
            background: white; border-radius: 10px; 
            box-shadow: 0 4px 25px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 { color: #28a745; margin-bottom: 20px; }
        p { color: #333; margin-bottom: 30px; }
        .btn {
            background-color: #1e76ff; color: white; border: none; 
            padding: 10px 20px; border-radius: 6px; cursor: pointer; 
            font-size: 16px; font-weight: bold; text-decoration: none;
            transition: background-color 0.2s;
        }
        .btn:hover { background-color: #1a5ac9; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Đổi Mật Khẩu Thành Công!</h2>
        <p>Mật khẩu của bạn đã được thay đổi. Vui lòng sử dụng mật khẩu mới cho lần đăng nhập tiếp theo.</p>
        <a href="{% url 'user_profile' %}" class="btn">Quay lại Profile</a>
    </div>
</body>
</html>
