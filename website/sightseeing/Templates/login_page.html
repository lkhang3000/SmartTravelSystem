{% load static %}
<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Log in</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="page">
  <main class="card">
    <h1 class="brand">Log in</h1>

    {% if messages %}
      {% for message in messages %}
        <div class="success">{{ message }}</div>
      {% endfor %}
    {% endif %}

    {% if form.non_field_errors %}
      <div class="error">{{ form.non_field_errors }}</div>
    {% endif %}

    <form id="loginForm" method="post" action="{% url 'login_page' %}" novalidate>
      {% csrf_token %}
      <button type="button" id="googleBtn" class="btn google">Continue with Google</button>

      <div class="divider"><span>OR</span></div>

      <label class="field">
        <span class="label">Email address</span>
        <input type="email" name="username" value="{{ form.username.value|default:'' }}" required />
        {% if form.username.errors %}<div class="field-error">{{ form.username.errors.0 }}</div>{% endif %}
      </label>

      <label class="field">
        <span class="label">Your password</span>
        <input type="password" name="password" required />
        {% if form.password.errors %}<div class="field-error">{{ form.password.errors.0 }}</div>{% endif %}
      </label>

      <div class="row-between">
        <a class="link" href="{% url 'password_reset' %}">Forget your password</a>
        <button type="submit" class="btn primary">Log in</button>
      </div>

      <p class="muted">Don't have an account? <a href="{% url 'signup_page' %}">Sign up</a></p>
    </form>
  </main>

</body>
</html>
