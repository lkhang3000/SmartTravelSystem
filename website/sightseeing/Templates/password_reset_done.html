{% load static %}
<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset Email Sent</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <style>
    .success-icon {
      font-size: 64px;
      color: #4CAF50;
      margin-bottom: 20px;
    }
  </style>
</head>
<body class="page">
  <main class="card" style="text-align: center;">
    <div class="success-icon">✓</div>
    <h1 class="brand">Check Your Email</h1>
    
    <p class="muted">We've sent you an email with instructions to reset your password.</p>
    <p class="muted">Please check your inbox and click the link in the email.</p>

    <div style="margin-top: 30px;">
      <a class="btn primary" href="{% url 'login_page' %}">Back to Login</a>
    </div>
  </main>

</body>
</html>
