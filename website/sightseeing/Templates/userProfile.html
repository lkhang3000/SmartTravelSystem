<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Tour Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f6f9ff;
            margin: 0;
        }
        header {
            background-color: #1e76ff;
            padding: 18px;
            text-align: center;
            font-size: 20px;
            color: white;
            font-weight: bold;
            position: relative;
        }
        .logout-btn {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background-color: orange;
            color: white;
            border: none;
            padding: 7px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .profile-container {
            width: 55%;
            background: white;
            margin: 40px auto;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.15);
        }
        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid #1e76ff;
            display: block;
            margin: auto;
        }
        .username {
            text-align: center;
            margin-top: 10px;
            font-size: 20px;
            font-weight: bold;
        }
        .section {
            background: #eaf2ff;
            padding: 18px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .section-title {
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #2b4d9e;
        }
        .tag {
            display: inline-block;
            background: white;
            padding: 3px 10px;
            border-radius: 6px;
            margin-right: 5px;
            border: 1px solid #c8d8ff;
            font-size: 12px;
            color: #2b4d9e;
        }
        .btn-row {
            text-align: center;
            margin-top: 25px;
        }
        .btn {
            background-color: orange;
            color: white;
            border: none;
            padding: 8px 22px;
            border-radius: 6px;
            cursor: pointer;
            margin: 0 10px;
            font-size: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <a href="{% url 'home' %}" style="text-decoration:none; color:white;">
        SMART TOUR
        </a>
        <a href="{% url 'logout' %}" style="text-decoration:none;">
            <button class="logout-btn">Logout</button>
        </a>
    </header>

    <div class="profile-container">
        <img src="https://ui-avatars.com/api/?name={{ user.username }}&background=1e76ff&color=fff&size=110" alt="Avatar" class="avatar">
        <div class="username">{{ user.username }}</div>

        <div class="section">
            <div class="section-title">📍 Destination</div>
            Ho Chi Minh City
        </div>

        <div class="section">
            <div class="section-title">❤️ Preferences</div>
            <span class="tag">Landmark</span>
            <span class="tag">Sanctuary</span>
            <span class="tag">Cultural Sites</span>
            <span class="tag">Local Cuisine</span>
        </div>

        <div class="section">
            <div class="section-title">💲 Budget</div>
            $500 - $1000
        </div>

        <div class="section">
            <div class="section-title">⭐ Preferred Ratings</div>
            4+ Stars
        </div>

        <div class="section">
            <div class="section-title">👥 Group Size</div>
            2–4 people
        </div>

        <div class="section">
            <div class="section-title">📅 Travel Dates</div>
            Arrival: <b>December 15, 2024</b><br>
            Departure: <b>December 22, 2024</b>
        </div>

        <div class="btn-row">
            <button class="btn">Edit</button>
            <button class="btn">Search</button>
        </div>
    </div>
</body>
</html>
