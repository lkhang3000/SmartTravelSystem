{% load static %}
<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset Password</title>
  <link rel="stylesheet" href="{% static 'accounts/css/styles.css' %}">
</head>
<body class="page">
  <main class="card">
    <h1 class="brand">Reset Password</h1>
    
    <p class="muted">Forgot your password? Enter your email address below, and we'll send you instructions to reset it.</p>

    {% if form.non_field_errors %}
      <div class="error">{{ form.non_field_errors }}</div>
    {% endif %}

    <form id="passwordResetForm" method="post" action="{% url 'password_reset' %}" novalidate>
      {% csrf_token %}

      <label class="field">
        <span class="label">Email address</span>
        <input type="email" name="email" value="{{ form.email.value|default:'' }}" required />
        {% if form.email.errors %}<div class="field-error">{{ form.email.errors.0 }}</div>{% endif %}
      </label>

      <div class="row-between">
        <a class="link" href="{% url 'login_page' %}">Back to Login</a>
        <button type="submit" class="btn primary">Send Reset Link</button>
      </div>
    </form>
  </main>

  <script src="{% static 'accounts/js/auth.js' %}"></script>
</body>
</html>
